name: Test and build web game

on:
  push:
    branches: [main, ci/github-pages]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  leaderboard-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test self-hosted leaderboard API
        run: node --test server/leaderboard/server.test.mjs
      - name: Build and smoke-test leaderboard container
        shell: bash
        run: |
          set -euo pipefail
          docker build -t gamejam-leaderboard server/leaderboard
          docker run --detach --rm --name leaderboard-smoke gamejam-leaderboard
          trap 'docker rm --force leaderboard-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..15}; do
            if docker exec leaderboard-smoke node -e "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then exit 0; fi
            sleep 1
          done
          docker logs leaderboard-smoke
          exit 1

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Cache Godot and web templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-web-linux-${{ env.GODOT_VERSION }}-v1

      - name: Install Godot and web export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot/editor.zip"
          curl --fail --location --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/godot/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/editor.zip" -d "$RUNNER_TEMP/godot"
          install -m 755 "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/.local/bin/godot"
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          unzip -j -q "$RUNNER_TEMP/godot/templates.tpz" 'templates/web_nothreads_release.zip' 'templates/version.txt' -d "$template_dir"

      - name: Add Godot to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Run gameplay and integration tests
        shell: bash
        run: |
          set -euo pipefail
          for scene in \
            tests/game_logic/test_package3.tscn \
            tests/game_logic/test_touch_controls.tscn \
            tests/game_logic/test_run_clock.tscn \
            tests/game_logic/test_leaderboard_client.tscn \
            tests/player_test/test_player_moves.tscn \
            tests/player_test/test_fall_damage.tscn \
            tests/level_test/test_levels_flow.tscn \
            tests/level_test/test_moving_platforms.tscn \
            tests/level_test/test_level_gates.tscn \
            tests/level_test/test_level_backgrounds.tscn \
            tests/level_test/test_hazard_placement.tscn \
            tests/hazard_test/test_hazards.tscn \
            tests/jarvis/test_jarvis.tscn
          do
            timeout 90s godot --headless --path . "$scene" 2>&1 | tee "$RUNNER_TEMP/test.log"
            if grep -Eq '^FAIL |SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/test.log"; then exit 1; fi
          done

      - name: Export browser build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.js
          test -s build/web/index.wasm
          test -s build/web/index.pck
          touch build/web/.nojekyll
          cp ui/shared/FONT_LICENSE.txt build/web/FONT_LICENSE.txt

      - name: Upload downloadable web build
        uses: actions/upload-artifact@v4
        with:
          name: web-game
          path: build/web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, leaderboard-api]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
